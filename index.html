<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iloveastro</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #app {
      position: relative;
    }
    #loadingOverlay.loading-overlay {
      height: calc(100svh - 190px);
      min-height: 360px;
      display: grid;
      place-items: center;
      background: #fff;
      color: #000;
      overflow: hidden;
    }
    #loadingOverlay .loading-card {
      border: 0;
      background: transparent;
      padding: 0;
      text-align: center;
    }
    #loadingOverlay .loading-word {
      min-height: 2.2rem;
      font: 700 2rem/1.2 Arial, sans-serif;
      letter-spacing: 0.08em;
    }
    #loadingOverlay .loading-note {
      margin-top: 0.45rem;
      font: 400 0.85rem/1.2 Arial, sans-serif;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>iloveastro</h1>
    <div class="save-menu">
      <button id="saveMenuButton" type="button" aria-expanded="false" aria-controls="saveMenu">☰</button>
      <div id="saveMenu" class="save-menu-panel" hidden>
        <div class="small">scores</div>
        <button type="button" data-save-slot="1">save 1</button>
        <button type="button" data-save-slot="2">save 2</button>
        <button type="button" data-save-slot="3">save 3</button>
        <hr>
        <div class="small">defaults</div>
        <label class="save-slider-label">default FOV
          <div class="slider-text-row">
            <input id="defaultFovSlider" type="range" min="20" max="190" step="5">
            <input id="defaultFovInput" type="number" min="20" max="190" step="5">
          </div>
        </label>
        <label class="save-slider-label">default magnitude
          <div class="slider-text-row">
            <input id="defaultMagSlider" type="range" min="4" max="6" step="0.1">
            <input id="defaultMagInput" type="number" min="4" max="6" step="0.1">
          </div>
        </label>
        <hr>
        <div class="small">score backup</div>
        <textarea id="scoreBackupText" spellcheck="false"></textarea>
        <div class="controls save-backup-controls">
          <button id="scoreExport" type="button">export current save</button>
          <button id="scoreImport" type="button">import to current save</button>
        </div>
        <div id="scoreBackupMsg" class="message"></div>
        <hr>
        <button id="resetProgress" type="button">clear current save</button>
        <button id="clearAllSaves" type="button">clear all saves</button>
      </div>
    </div>
  </header>
  <nav id="tabs" aria-label="games"><button type="button" class="active">SkyGuessr</button><button type="button">SkyRace</button><button type="button">Sky Map</button><button type="button">Constellation Map</button><button type="button">Find Constellation</button><button type="button">Guess Constellation</button><button type="button">Stars</button><button type="button">DSOs</button><button type="button">88 Timer</button><button type="button">Atlas</button><button type="button">Tables</button><button type="button">Misc</button></nav>
  <main id="app">
    <section id="loadingOverlay" class="loading-overlay" data-launch="1">
      <div class="loading-card">
        <div class="loading-word" aria-live="polite">i</div>
        <div class="loading-note">loading...</div>
      </div>
    </section>
  </main>
  <script>
    window.__iloveastroLoadingFrames = ['i','il','ilo','ilov','ilove','ilovea','iloveas','iloveast','iloveastr','iloveastro','loveastro','oveastro','veastro','eastro','astro','stro','tro','ro','o'];
    window.__iloveastroLoaderMs = 70;
    window.__iloveastroLaunchStartedAt = Date.now();
    window.__iloveastroMinLaunchMs = window.__iloveastroLoadingFrames.length * window.__iloveastroLoaderMs;
    window.__iloveastroUnlocked = false;
    window.__iloveastroUnlockRequested = false;
    window.__iloveastroUnlockCompletionQueued = false;
    window.__iloveastroUnlockBuffer = '';
    window.__iloveastroLaunchFrameIndex = 0;
    window.__iloveastroCompleteUnlock = function () {
      if (window.__iloveastroUnlocked) return;
      window.__iloveastroUnlocked = true;
      window.__iloveastroUnlockRequested = false;
      window.__iloveastroUnlockCompletionQueued = false;
      window.dispatchEvent(new Event('iloveastro-unlock'));
    };
    window.__iloveastroQueueUnlockCompletion = function () {
      if (window.__iloveastroUnlockCompletionQueued || window.__iloveastroUnlocked) return;
      window.__iloveastroUnlockCompletionQueued = true;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { window.__iloveastroCompleteUnlock(); });
      });
    };
    window.__iloveastroLaunchLoader = setInterval(function () {
      var el = document.querySelector('#loadingOverlay .loading-word');
      if (!el) return;
      window.__iloveastroLaunchFrameIndex = (window.__iloveastroLaunchFrameIndex + 1) % window.__iloveastroLoadingFrames.length;
      el.textContent = window.__iloveastroLoadingFrames[window.__iloveastroLaunchFrameIndex];
      if (window.__iloveastroUnlockRequested && window.__iloveastroLaunchFrameIndex === window.__iloveastroLoadingFrames.length - 1) {
        window.__iloveastroQueueUnlockCompletion();
      }
    }, window.__iloveastroLoaderMs);
    window.__iloveastroUnlockHandler = function (event) {
      if (event.ctrlKey || event.metaKey || event.altKey || typeof event.key !== 'string' || event.key.length !== 1) return;
      var ch = event.key.toLowerCase();
      if (ch < 'a' || ch > 'z') return;
      window.__iloveastroUnlockBuffer = (window.__iloveastroUnlockBuffer + ch).slice(-8);
      if (window.__iloveastroUnlockBuffer !== 'crescent') return;
      window.__iloveastroUnlockRequested = true;
      window.removeEventListener('keydown', window.__iloveastroUnlockHandler, true);
      window.__iloveastroUnlockHandler = null;
      if (window.__iloveastroLaunchFrameIndex === window.__iloveastroLoadingFrames.length - 1) {
        window.__iloveastroQueueUnlockCompletion();
      }
    };
    window.addEventListener('keydown', window.__iloveastroUnlockHandler, true);
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
